<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseSports | Live Scoreboard, Stats & Fixtures</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.92); }
    }
    .pulse-indicator { animation: pulse-fast 1.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i data-lucide="trophy" class="w-5 h-5 text-slate-950 stroke-[2.5]"></i>
        </div>
        <div>
          <span class="text-xl font-black tracking-tight text-white">Pulse<span class="text-emerald-400">Sports</span></span>
          <span class="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Dynamic Live Feed</span>
        </div>
      </div>

      <!-- Sports Filters -->
      <nav id="sport-tabs" class="flex items-center gap-1 sm:gap-2 overflow-x-auto py-2"></nav>
    </div>

    <!-- Sub-navigation: Time Horizons -->
    <div class="border-t border-slate-800/80 bg-slate-900/50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between text-sm">
        <div class="flex gap-6 py-2.5 font-medium" id="status-tabs"></div>
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 pulse-indicator"></span>
          Live Ball-by-Ball Active
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
    <!-- Search / Filter Bar -->
    <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 rounded-2xl bg-gradient-to-r from-slate-900 via-slate-900/90 to-slate-900/40 border border-slate-800">
      <div class="flex items-center space-x-3">
        <div class="p-2 rounded-lg bg-emerald-500/10 text-emerald-400">
          <i data-lucide="radio" class="w-5 h-5 pulse-indicator"></i>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-slate-200">Global Match Center</h2>
          <p class="text-xs text-slate-400">Live scorecards, real-time ball-by-ball commentary, player stats, and lineups.</p>
        </div>
      </div>
      <div>
        <input 
          id="search-input" 
          type="text" 
          placeholder="Filter team, series or player..." 
          class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-full sm:w-64"
        />
      </div>
    </div>

    <!-- Match Cards Grid -->
    <div id="matches-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16">
      <i data-lucide="frown" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
      <h3 class="text-base font-semibold text-slate-400">No matches found for this filter</h3>
      <p class="text-xs text-slate-500 mt-1">Try switching sport or match phase tabs.</p>
    </div>
  </main>

  <!-- Modal -->
  <div id="modal-container" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
      <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/90 sticky top-0 z-10">
        <div>
          <div class="flex items-center gap-2">
            <span id="modal-sport-badge" class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"></span>
            <span id="modal-series-title" class="text-xs text-slate-400 font-medium truncate"></span>
          </div>
          <h2 id="modal-match-title" class="text-lg font-bold text-white mt-1"></h2>
        </div>
        <button id="modal-close-btn" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex border-b border-slate-800 bg-slate-950 px-5 text-sm font-medium gap-6">
        <button id="modal-tab-scorecard" class="py-3 text-emerald-400 border-b-2 border-emerald-400">Scorecard</button>
        <button id="modal-tab-timeline" class="py-3 text-slate-400 hover:text-slate-200">Live Commentary / Events</button>
        <button id="modal-tab-squads" class="py-3 text-slate-400 hover:text-slate-200">Lineups & Squads</button>
      </div>

      <div id="modal-content-area" class="p-5 sm:p-6 overflow-y-auto space-y-6 text-sm"></div>
    </div>
  </div>

  <script>
    const sports = [
      { id: 'all', name: 'All Sports', icon: 'layers' },
      { id: 'cricket', name: 'Cricket', icon: 'award' },
      { id: 'football', name: 'Football', icon: 'shield' },
      { id: 'basketball', name: 'Basketball', icon: 'dribbble' },
      { id: 'tennis', name: 'Tennis', icon: 'target' }
    ];

    const matchStatuses = [
      { id: 'live', name: 'Live Now' },
      { id: 'past', name: 'Results / Past' },
      { id: 'future', name: 'Upcoming Fixtures' }
    ];

    let matches = [
      {
        id: 'c1',

        summary: 'India won the toss and elected to field',
        activeStrikerIdx: 5, // Nathan Smith
        activeBowlerIdx: 3,  // Axar Patel
        scorecard: {

            { name: 'Daryl Mitchell', dismiss: 'c Iyer b Brar', runs: 32, balls: 54, f4: 2, f6: 1, sr: 59.2 },
            { name: 'Tom Latham (wk)', dismiss: 'lbw b Axar', runs: 18, balls: 31, f4: 1, f6: 0, sr: 58.0 },
            { name: 'Glenn Phillips', dismiss: 'c & b Brar', runs: 6, balls: 12, f4: 0, f6: 0, sr: 50.0 },
            { name: 'Nathan Smith', dismiss: 'not out', runs: 11, balls: 28, f4: 0, f6: 0, sr: 39.2 },
            { name: 'Kyle Jamieson', dismiss: 'not out', runs: 1, balls: 4, f4: 0, f6: 0, sr: 25.0 }
          ],
          bowling: [
            { name: 'Mohammed Siraj', o: 7.0, m: 1, r: 24, w: 0, econ: 3.42 },
            { name: 'Anshul Kamboj', o: 7.0, m: 0, r: 23, w: 1, econ: 3.28 },
            { name: 'Gurnoor Brar', o: 8.0, m: 2, r: 21, w: 3, econ: 2.62 },
            { name: 'Axar Patel', o: 7.3, m: 1, r: 25, w: 1, econ: 3.33 },
            { name: 'Kuldeep Yadav', o: 7.0, m: 0, r: 27, w: 1, econ: 3.85 }
          ]
        },
        commentary: [
          '36.3 Axar to Jamieson, no run, tapped gently on the front foot towards cover.',
          '36.2 Axar to Jamieson, 1 run, pushed into the gap at mid-on.',
          '36.1 Axar to Smith, 1 run, driven down to long-off for an easy single.'
        ],
        squads: {
          teamA: ['Devon Conway', 'Will Young', 'Rachin Ravindra', 'Daryl Mitchell', 'Tom Latham (c/wk)', 'Glenn Phillips', 'Nathan Smith', 'Kyle Jamieson', 'Mitchell Santner', 'Ish Sodhi', 'Lockie Ferguson'],
          teamB: ['Shubman Gill (c)', 'Ruturaj Gaikwad', 'Virat Kohli', 'Shreyas Iyer', 'KL Rahul (wk)', 'Ishan Kishan', 'Axar Patel', 'Kuldeep Yadav', 'Mohammed Siraj', 'Anshul Kamboj', 'Gurnoor Brar']
        }
      },
      {
        id: 'f1',
        sport: 'football',
        status: 'live',
        series: 'UEFA Champions League Quarter-Final 2nd Leg',
        venue: 'Santiago Bernabéu, Madrid, Spain',
        teamA: { name: 'Real Madrid', short: 'RMA', score: '2', flagUrl: 'https://flagcdn.com/w40/es.png' },
        teamB: { name: 'Manchester City', short: 'MCI', score: '2', flagUrl: 'https://flagcdn.com/w40/gb-eng.png' },
        liveText: '78\' • Agg: 5 - 5 • Bellingham 72\', Vinícius 12\' | Haaland 41\', Foden 58\'',
        summary: 'Tied 5-5 on aggregate',
        stats: {
          possession: ['48%', '52%'],
          shots: ['14', '15'],
          shotsOnTarget: ['6', '7'],
          xG: ['1.84', '1.92'],
          corners: ['5', '8']
        },
        events: [
          '72\' GOAL! Jude Bellingham pounces on a loose ball in the box! (2-2)',
          '58\' GOAL! Phil Foden curls a beauty into the top corner! (1-2)',
          '41\' GOAL! Erling Haaland headers home from Kevin De Bruyne\'s cross! (1-1)'
        ],
        squads: {
          teamA: ['Courtois (GK)', 'Carvajal', 'Rüdiger', 'Militao', 'Mendy', 'Valverde', 'Camavinga', 'Bellingham', 'Rodrygo', 'Mbappé', 'Vinícius Jr'],
          teamB: ['Ederson (GK)', 'Walker', 'Dias', 'Akanji', 'Gvardiol', 'Rodri', 'De Bruyne', 'Bernardo Silva', 'Foden', 'Doku', 'Haaland']
        }
      },
      {
        id: 'b1',
        sport: 'basketball',
        status: 'live',
        series: 'NBA Western Conference Clash',
        venue: 'Chase Center, San Francisco, USA',
        teamA: { name: 'Golden State Warriors', short: 'GSW', score: '112', flagUrl: 'https://flagcdn.com/w40/us.png' },
        teamB: { name: 'Los Angeles Lakers', short: 'LAL', score: '108', flagUrl: 'https://flagcdn.com/w40/us.png' },
        liveText: 'Q4 • 02:45 • Curry 34 pts, 8 ast | LeBron 28 pts, 9 reb',
        summary: 'Warriors on a late 8-2 run',
        boxScore: [
          { team: 'GSW', q1: 28, q2: 30, q3: 29, q4: 25, total: 112 },
          { team: 'LAL', q1: 26, q2: 32, q3: 24, q4: 26, total: 108 }
        ],
        squads: {
          teamA: ['Stephen Curry', 'Brandin Podziemski', 'Andrew Wiggins', 'Jonathan Kuminga', 'Draymond Green'],
          teamB: ['D\'Angelo Russell', 'Austin Reaves', 'LeBron James', 'Rui Hachimura', 'Anthony Davis']
        }
      },
      {
        id: 'c2',
        sport: 'cricket',
        status: 'past',
        series: 'India Tour of New Zealand 2026 • 1st ODI',
        venue: 'Eden Park, Auckland',
        teamA: { name: 'New Zealand', short: 'NZ', runs: 185, wickets: 10, overNum: 40, ballNum: 2, flagUrl: 'https://flagcdn.com/w40/nz.png' },
        teamB: { name: 'India', short: 'IND', runs: 143, wickets: 5, overNum: 22, ballNum: 4, flagUrl: 'https://flagcdn.com/w40/in.png' },
        liveText: 'India won by 5 wickets (DLS Method) • POTM: Anshul Kamboj (4/32)',
        summary: 'Target revised to 140 in 25 overs due to rain interruptions',
        squads: {
          teamA: ['Conway', 'Young', 'Ravindra', 'Mitchell', 'Latham', 'Phillips', 'Smith', 'Jamieson'],
          teamB: ['Gill', 'Gaikwad', 'Kohli', 'Iyer', 'Rahul', 'Kishan', 'Axar', 'Kuldeep', 'Siraj', 'Kamboj']
        }
      },
      {
        id: 'c3',
        sport: 'cricket',
        status: 'future',
        series: 'India Tour of New Zealand 2026 • 3rd ODI',
        venue: 'Seddon Park, Hamilton',
        teamA: { name: 'New Zealand', short: 'NZ', runs: null, flagUrl: 'https://flagcdn.com/w40/nz.png' },
        teamB: { name: 'India', short: 'IND', runs: null, flagUrl: 'https://flagcdn.com/w40/in.png' },
        liveText: 'Starts Tuesday, Nov 10 • 07:30 IST (15:00 NZDT)',
        summary: 'Pitch Report: Fast, hard deck favorable to batting under floodlights',
        squads: {
          teamA: ['Tom Latham (c)', 'Devon Conway', 'Rachin Ravindra', 'Daryl Mitchell', 'Glenn Phillips'],
          teamB: ['Shubman Gill (c)', 'Virat Kohli', 'Shreyas Iyer', 'KL Rahul (wk)', 'Axar Patel']
        }
      }
    ];

    let currentSport = 'all';
    let currentStatus = 'live';
    let searchQuery = '';
    let selectedMatch = null;
    let activeModalTab = 'scorecard';

    const sportTabsContainer = document.getElementById('sport-tabs');
    const statusTabsContainer = document.getElementById('status-tabs');
    const matchesGrid = document.getElementById('matches-grid');
    const emptyState = document.getElementById('empty-state');
    const searchInput = document.getElementById('search-input');
    const modal = document.getElementById('modal-container');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    function renderFilters() {
      sportTabsContainer.innerHTML = sports.map(s => {
        const active = currentSport === s.id;
        return `
          <button 
            onclick="selectSport('${s.id}')"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition whitespace-nowrap ${
              active 
                ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/20' 
                : 'text-slate-300 hover:bg-slate-800'
            }"
          >
            <i data-lucide="${s.icon}" class="w-3.5 h-3.5"></i>
            ${s.name}
          </button>
        `;
      }).join('');

      statusTabsContainer.innerHTML = matchStatuses.map(st => {
        const active = currentStatus === st.id;
        return `
          <button 
            onclick="selectStatus('${st.id}')"
            class="pb-2 border-b-2 text-xs font-bold transition flex items-center gap-2 ${
              active 
                ? 'border-emerald-400 text-emerald-400' 
                : 'border-transparent text-slate-400 hover:text-slate-200'
            }"
          >
            ${st.id === 'live' ? '<span class="w-2 h-2 rounded-full bg-red-500 pulse-indicator"></span>' : ''}
            ${st.name}
          </button>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.selectSport = (id) => {
      currentSport = id;
      renderFilters();
      renderMatches();
    };

    window.selectStatus = (id) => {
      currentStatus = id;
      renderFilters();
      renderMatches();
    };

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderMatches();
    });

    function getCricketScoreString(team, isFuture) {
      if (isFuture) return '-';
      if (team.runs === null || team.runs === 0 && team.overNum === 0) return 'Yet to bat';
      return `${team.runs}/${team.wickets} (${team.overNum}.${team.ballNum})`;
    }

    function renderMatches() {
      const filtered = matches.filter(m => {
        const matchSport = currentSport === 'all' || m.sport === currentSport;
        const matchStatus = m.status === currentStatus;
        const matchQuery = 
          m.teamA.name.toLowerCase().includes(searchQuery) ||
          m.teamB.name.toLowerCase().includes(searchQuery) ||
          m.series.toLowerCase().includes(searchQuery) ||
          m.venue.toLowerCase().includes(searchQuery);

        return matchSport && matchStatus && matchQuery;
      });

      if (filtered.length === 0) {
        matchesGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      matchesGrid.innerHTML = filtered.map(m => {
        const isLive = m.status === 'live';
        const isCricket = m.sport === 'cricket';
        const scoreA = isCricket ? getCricketScoreString(m.teamA, m.status === 'future') : (m.teamA.score || '-');
        const scoreB = isCricket ? getCricketScoreString(m.teamB, m.status === 'future') : (m.teamB.score || '-');

        return `
          <div 
            onclick="openMatchModal('${m.id}')" 
            class="group cursor-pointer rounded-2xl bg-slate-900 border border-slate-800 p-5 hover:border-emerald-500/50 hover:shadow-xl hover:shadow-emerald-500/5 transition duration-200 flex flex-col justify-between"
          >
            <div>
              <div class="flex items-center justify-between text-xs text-slate-400 mb-3">
                <span class="font-medium truncate max-w-[200px] text-slate-300">${m.series}</span>
                <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase ${
                  isLive 
                    ? 'bg-red-500/20 text-red-400 border border-red-500/30 pulse-indicator' 
                    : m.status === 'past' 
                    ? 'bg-slate-800 text-slate-300' 
                    : 'bg-blue-500/20 text-blue-400'
                }">
                  ${m.status.toUpperCase()}
                </span>
              </div>

              <div class="space-y-3 my-4">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    <img src="${m.teamA.flagUrl}" alt="${m.teamA.name}" class="w-6 h-4 object-cover rounded shadow-sm border border-slate-700/60" />
                    <span class="font-bold text-slate-100 text-sm group-hover:text-emerald-400 transition">${m.teamA.name}</span>
                  </div>
                  <span class="font-mono font-bold text-sm text-white">${scoreA}</span>
                </div>

                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    <img src="${m.teamB.flagUrl}" alt="${m.teamB.name}" class="w-6 h-4 object-cover rounded shadow-sm border border-slate-700/60" />
                    <span class="font-bold text-slate-100 text-sm group-hover:text-emerald-400 transition">${m.teamB.name}</span>
                  </div>
                  <span class="font-mono font-bold text-sm text-white">${scoreB}</span>
                </div>
              </div>
            </div>

            <div class="pt-3 border-t border-slate-800/80 text-xs">
              <p class="text-emerald-400 font-medium truncate">${m.liveText}</p>
              <p class="text-slate-500 text-[11px] mt-1 flex items-center gap-1 truncate">
                <i data-lucide="map-pin" class="w-3 h-3 flex-shrink-0"></i> ${m.venue}
              </p>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.openMatchModal = (id) => {
      selectedMatch = matches.find(m => m.id === id);
      if (!selectedMatch) return;

      document.getElementById('modal-sport-badge').innerText = selectedMatch.sport;
      document.getElementById('modal-series-title').innerText = selectedMatch.series;
      document.getElementById('modal-match-title').innerHTML = `
        <div class="flex items-center gap-2">
          <img src="${selectedMatch.teamA.flagUrl}" class="w-5 h-3.5 rounded object-cover border border-slate-700" />
          <span>${selectedMatch.teamA.name}</span>
          <span class="text-slate-500 text-sm font-normal">vs</span>
          <img src="${selectedMatch.teamB.flagUrl}" class="w-5 h-3.5 rounded object-cover border border-slate-700" />
          <span>${selectedMatch.teamB.name}</span>
        </div>
      `;

      setModalTab('scorecard');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    modalCloseBtn.addEventListener('click', () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    });

    function setModalTab(tab) {
      activeModalTab = tab;
      ['scorecard', 'timeline', 'squads'].forEach(t => {
        const el = document.getElementById(`modal-tab-${t}`);
        if (t === tab) {
          el.className = 'py-3 text-emerald-400 border-b-2 border-emerald-400 font-semibold';
        } else {
          el.className = 'py-3 text-slate-400 hover:text-slate-200';
        }
      });
      renderModalBody();
    }

    document.getElementById('modal-tab-scorecard').addEventListener('click', () => setModalTab('scorecard'));
    document.getElementById('modal-tab-timeline').addEventListener('click', () => setModalTab('timeline'));
    document.getElementById('modal-tab-squads').addEventListener('click', () => setModalTab('squads'));

    function renderModalBody() {
      const container = document.getElementById('modal-content-area');
      const m = selectedMatch;
      if (!m) return;

      if (activeModalTab === 'scorecard') {
        if (m.sport === 'cricket' && m.scorecard) {
          const scoreStr = getCricketScoreString(m.teamA, m.status === 'future');
          container.innerHTML = `
            <div>
              <h4 class="font-bold text-slate-200 mb-3 flex items-center justify-between">
                <span class="flex items-center gap-2">
                  <i data-lucide="target" class="w-4 h-4 text-emerald-400"></i> ${m.teamA.name} Batting Innings
                </span>
                <span class="font-mono text-emerald-400 text-sm">${scoreStr}</span>
              </h4>
              <div class="overflow-x-auto rounded-xl border border-slate-800">
                <table class="w-full text-left text-xs font-mono">
                  <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
                    <tr>
                      <th class="p-2.5 font-sans">Batter</th>
                      <th class="p-2.5 font-sans">Dismissal</th>
                      <th class="p-2.5 text-right">R</th>
                      <th class="p-2.5 text-right">B</th>
                      <th class="p-2.5 text-right">4s</th>
                      <th class="p-2.5 text-right">6s</th>
                      <th class="p-2.5 text-right">SR</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${m.scorecard.batting.map(b => `
                      <tr class="hover:bg-slate-800/30">
                        <td class="p-2.5 font-bold font-sans ${b.dismiss === 'not out' ? 'text-emerald-300 flex items-center gap-1.5' : 'text-slate-300'}">
                          ${b.name} ${b.dismiss === 'not out' ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>' : ''}
                        </td>
                        <td class="p-2.5 text-slate-400 font-sans text-[11px]">${b.dismiss}</td>
                        <td class="p-2.5 text-right font-bold text-white">${b.runs}</td>
                        <td class="p-2.5 text-right text-slate-400">${b.balls}</td>
                        <td class="p-2.5 text-right">${b.f4}</td>
                        <td class="p-2.5 text-right">${b.f6}</td>
                        <td class="p-2.5 text-right text-slate-400">${b.sr}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div>
              <h4 class="font-bold text-slate-200 mb-3 flex items-center gap-2">
                <i data-lucide="activity" class="w-4 h-4 text-cyan-400"></i> ${m.teamB.name} Bowling Figures
              </h4>
              <div class="overflow-x-auto rounded-xl border border-slate-800">
                <table class="w-full text-left text-xs font-mono">
                  <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
                    <tr>
                      <th class="p-2.5 font-sans">Bowler</th>
                      <th class="p-2.5 text-right">O</th>
                      <th class="p-2.5 text-right">M</th>
                      <th class="p-2.5 text-right">R</th>
                      <th class="p-2.5 text-right font-bold text-white">W</th>
                      <th class="p-2.5 text-right">Econ</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${m.scorecard.bowling.map(bw => `
                      <tr class="hover:bg-slate-800/30">
                        <td class="p-2.5 font-bold font-sans text-slate-100">${bw.name}</td>
                        <td class="p-2.5 text-right">${bw.o.toFixed(1)}</td>
                        <td class="p-2.5 text-right text-slate-400">${bw.m}</td>
                        <td class="p-2.5 text-right">${bw.r}</td>
                        <td class="p-2.5 text-right font-bold text-emerald-400">${bw.w}</td>
                        <td class="p-2.5 text-right text-slate-400">${bw.econ.toFixed(2)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        } else if (m.sport === 'football' && m.stats) {
          container.innerHTML = `
            <div class="space-y-4">
              <h4 class="font-bold text-slate-200">Match Statistics</h4>
              ${Object.keys(m.stats).map(key => {
                const valA = m.stats[key][0];
                const valB = m.stats[key][1];
                return `
                  <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                      <span>${valA}</span>
                      <span class="text-slate-400 capitalize">${key}</span>
                      <span>${valB}</span>
                    </div>
                    <div class="h-2 bg-slate-800 rounded-full flex overflow-hidden">
                      <div class="bg-emerald-500 h-full" style="width: 50%"></div>
                      <div class="bg-cyan-500 h-full" style="width: 50%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else if (m.sport === 'basketball' && m.boxScore) {
          container.innerHTML = `
            <div class="space-y-5">
              <h4 class="font-bold text-slate-200">Quarter Scoring</h4>
              <div class="overflow-x-auto rounded-xl border border-slate-800">
                <table class="w-full text-center text-xs font-mono">
                  <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
                    <tr>
                      <th class="p-2.5 text-left font-sans">Team</th>
                      <th class="p-2.5">Q1</th>
                      <th class="p-2.5">Q2</th>
                      <th class="p-2.5">Q3</th>
                      <th class="p-2.5">Q4</th>
                      <th class="p-2.5 font-bold text-white">Total</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${m.boxScore.map(b => `
                      <tr>
                        <td class="p-2.5 text-left font-bold font-sans">${b.team}</td>
                        <td class="p-2.5">${b.q1}</td>
                        <td class="p-2.5">${b.q2}</td>
                        <td class="p-2.5">${b.q3}</td>
                        <td class="p-2.5">${b.q4}</td>
                        <td class="p-2.5 font-bold text-emerald-400">${b.total}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="p-8 text-center text-slate-500">
              <p>Full match score breakdown will unlock once play begins.</p>
              <p class="text-xs text-slate-600 mt-2">${m.summary}</p>
            </div>
          `;
        }
      } else if (activeModalTab === 'timeline') {
        const events = m.commentary || m.events || [];
        if (events.length > 0) {
          container.innerHTML = `
            <div class="space-y-3">
              ${events.map((ev, i) => `
                <div class="p-3 rounded-xl bg-slate-950 border ${i === 0 ? 'border-emerald-500/50 bg-emerald-950/10' : 'border-slate-800'} text-xs flex gap-3 items-start">
                  <span class="w-2 h-2 rounded-full ${i === 0 ? 'bg-emerald-400 pulse-indicator' : 'bg-slate-600'} mt-1.5 flex-shrink-0"></span>
                  <p class="text-slate-200 font-mono">${ev}</p>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          container.innerHTML = `<p class="text-center text-slate-500 py-8">No live commentary feeds registered yet for this match.</p>`;
        }
      } else if (activeModalTab === 'squads') {
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
              <h4 class="font-bold text-emerald-400 mb-3 flex items-center gap-2">
                <img src="${m.teamA.flagUrl}" class="w-4 h-3 rounded object-cover" /> ${m.teamA.name} Squad
              </h4>
              <ul class="space-y-2 text-xs text-slate-300">
                ${(m.squads.teamA || []).map(p => `<li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>${p}</li>`).join('')}
              </ul>
            </div>
            <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
              <h4 class="font-bold text-cyan-400 mb-3 flex items-center gap-2">
                <img src="${m.teamB.flagUrl}" class="w-4 h-3 rounded object-cover" /> ${m.teamB.name} Squad
              </h4>
              <ul class="space-y-2 text-xs text-slate-300">
                ${(m.squads.teamB || []).map(p => `<li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>${p}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }

      lucide.createIcons();
    }

    // --- Dynamic Ball-by-Ball Simulation Engine ---
    const commentaryPhrases = {
      0: ['defended solidly back down the pitch.', 'beaten outside off! Whistles past the edge.', 'tapped gently towards cover, no run.'],
      1: ['pushed into the gap at deep mid-wicket for a single.', 'driven down to long-on for an easy run.', 'nudged softly off the pads towards square leg.'],
      2: ['clipped past mid-wicket, call is for two and they get it comfortably!'],
      4: ['FOUR! Cracking shot through extra cover, finds the gap with ease!', 'FOUR! Short ball and pulled away with authority behind square!'],
      6: ['SIX! Tossed up and launched deep into the stands! What a blow!']
    };

    function simulateLiveBall() {
      const match = matches.find(m => m.id === 'c1');
      if (!match) return;

      // Increment ball count
      match.teamA.ballNum += 1;
      if (match.teamA.ballNum > 6) {
        match.teamA.ballNum = 1;
        match.teamA.overNum += 1;
      }

      const overStr = `${match.teamA.overNum}.${match.teamA.ballNum}`;
      const batter = match.scorecard.batting[match.activeStrikerIdx];
      const bowler = match.scorecard.bowling[match.activeBowlerIdx];

      // Possible outcomes: 0, 1, 2, 4, 6
      const outcomes = [0, 1, 0, 1, 2, 0, 4, 1, 6];
      const runs = outcomes[Math.floor(Math.random() * outcomes.length)];

      match.teamA.runs += runs;
      batter.runs += runs;
      batter.balls += 1;
      if (runs === 4) batter.f4 += 1;
      if (runs === 6) batter.f6 += 1;
      batter.sr = ((batter.runs / batter.balls) * 100).toFixed(1);

      bowler.r += runs;
      const totalOvers = match.teamA.overNum + (match.teamA.ballNum / 6);
      bowler.o = Math.floor(totalOvers) + (match.teamA.ballNum / 10);
      bowler.econ = (bowler.r / totalOvers);

      const phrases = commentaryPhrases[runs];
      const desc = phrases[Math.floor(Math.random() * phrases.length)];
      const newCommentary = `${overStr} ${bowler.name.split(' ').pop()} to ${batter.name.split(' ').pop()}, ${runs === 0 ? 'no run' : runs + (runs === 1 ? ' run' : ' runs')}, ${desc}`;

      // Prepend to commentary feed
      match.commentary.unshift(newCommentary);
      if (match.commentary.length > 20) match.commentary.pop();

      // Update live card text
      const crr = (match.teamA.runs / totalOvers).toFixed(2);
      match.liveText = `NZ ${match.teamA.runs}/${match.teamA.wickets} (${overStr}) • CRR: ${crr} • ${bowler.name} ${bowler.w}/${bowler.r} • ${batter.name} ${batter.runs}*(${batter.balls})`;

      // Re-render UI
      renderMatches();
      if (selectedMatch && selectedMatch.id === 'c1') {
        renderModalBody();
      }
    }

    // Run delivery every 4 seconds
    setInterval(simulateLiveBall, 4000);

    renderFilters();
    renderMatches();
  </script>
</body>
</html>
