<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseSports | Live Scoreboard, Stats & Fixtures</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    .pulse-indicator { animation: pulse-fast 1.6s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i data-lucide="trophy" class="w-5 h-5 text-slate-950 stroke-[2.5]"></i>
        </div>
        <div>
          <span class="text-xl font-black tracking-tight text-white">Pulse<span class="text-emerald-400">Sports</span></span>
          <span class="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Live Feed Active</span>
        </div>
      </div>

      <!-- Sport Filter Buttons -->
      <nav id="sport-tabs" class="flex items-center gap-1 sm:gap-2 overflow-x-auto py-2">
        <!-- Rendered via JS -->
      </nav>
    </div>

    <!-- Match Timeline Tab Sub-Header -->
    <div class="border-t border-slate-800/80 bg-slate-900/40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between text-sm">
        <div class="flex gap-6 py-2.5 font-medium" id="status-tabs">
          <!-- Rendered via JS -->
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 pulse-indicator"></span>
          Auto-Refreshing
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
    <!-- Featured Headline Bar -->
    <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 rounded-2xl bg-gradient-to-r from-slate-900 via-slate-900/80 to-slate-900/40 border border-slate-800">
      <div class="flex items-center space-x-3">
        <div class="p-2 rounded-lg bg-emerald-500/10 text-emerald-400">
          <i data-lucide="radio" class="w-5 h-5 pulse-indicator"></i>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-slate-200">Real-Time Multi-Sport Engine</h2>
          <p class="text-xs text-slate-400">Select any match to inspect the comprehensive scorecard, ball-by-ball / timeline, and player stats.</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <input 
          id="search-input" 
          type="text" 
          placeholder="Filter team, player or venue..." 
          class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-full sm:w-64"
        />
      </div>
    </div>

    <!-- Matches Grid -->
    <div id="matches-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16">
      <i data-lucide="frown" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
      <h3 class="text-base font-semibold text-slate-400">No matches found for this filter</h3>
      <p class="text-xs text-slate-500 mt-1">Try switching sport or match phase.</p>
    </div>
  </main>

  <!-- Full Scorecard & Stats Modal -->
  <div id="modal-container" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
      
      <!-- Modal Header -->
      <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/90 sticky top-0 z-10">
        <div>
          <div class="flex items-center gap-2">
            <span id="modal-sport-badge" class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"></span>
            <span id="modal-series-title" class="text-xs text-slate-400 font-medium truncate"></span>
          </div>
          <h2 id="modal-match-title" class="text-lg font-bold text-white mt-0.5"></h2>
        </div>
        <button id="modal-close-btn" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Modal Tabs -->
      <div class="flex border-b border-slate-800 bg-slate-950 px-5 text-sm font-medium gap-6">
        <button id="modal-tab-scorecard" class="py-3 text-emerald-400 border-b-2 border-emerald-400">Scorecard</button>
        <button id="modal-tab-timeline" class="py-3 text-slate-400 hover:text-slate-200">Timeline / Commentary</button>
        <button id="modal-tab-squads" class="py-3 text-slate-400 hover:text-slate-200">Squads & Lineups</button>
      </div>

      <!-- Modal Body -->
      <div id="modal-content-area" class="p-5 sm:p-6 overflow-y-auto space-y-6 text-sm">
        <!-- Injected via JavaScript based on selected sport -->
      </div>
    </div>
  </div>

  <!-- Database & Logic Script -->
  <script>

    const sports = [
      { id: 'all', name: 'All Sports', icon: 'layers' },
      { id: 'cricket', name: 'Cricket', icon: 'award' },

    const matchStatuses = [
      { id: 'live', name: 'Live' },
      { id: 'past', name: 'Results / Past' },
      { id: 'future', name: 'Fixtures / Upcoming' }
    ];

    const matches = [
      // Cricket Live

      // Football Live
      {

          corners: ['5', '9']
        },
        events: [
          '74\' Yellow Card: Dani Carvajal (RMA)',
          '68\' GOAL! Jude Bellingham fires low into the bottom-right corner! (2-2)',
          '58\' GOAL! Kevin De Bruyne curls a stunner from outside the box! (1-2)',
          '42\' GOAL! Erling Haaland headers home from a Jack Grealish cross. (1-1)',
          '34\' GOAL! Vinicius Jr finishes on the counter-attack! (1-0)'
        ],

          teamB: ['Ederson (GK)', 'Walker', 'Dias', 'Akanji', 'Gvardiol', 'Rodri', 'De Bruyne', 'Bernardo Silva', 'Foden', 'Grealish', 'Haaland']
        }
      },

      // Basketball Live
      {
        id: 'b1',
        sport: 'basketball',
        status: 'live',
        series: 'NBA Finals - Game 4',
        venue: 'TD Garden, Boston, MA',
        teamA: { name: 'Boston Celtics', short: 'BOS', score: '98', flag: '☘️' },
        teamB: { name: 'Dallas Mavericks', short: 'DAL', score: '94', flag: '🐴' },
        liveText: 'Q4 • 03:42 Remaining • Tatum 31 pts, Doncic 34 pts',
        summary: 'Celtics on a 7-0 run to reclaim the 4th-quarter lead',
        boxScore: [
          { team: 'BOS', q1: 26, q2: 24, q3: 25, q4: 23, total: 98 },
          { team: 'DAL', q1: 28, q2: 23, q3: 24, q4: 19, total: 94 }
        ],
        topPlayers: [
          { name: 'Jayson Tatum (BOS)', pts: 31, reb: 9, ast: 6, fg: '11/22' },
          { name: 'Jaylen Brown (BOS)', pts: 22, reb: 5, ast: 4, fg: '9/17' },
          { name: 'Luka Doncic (DAL)', pts: 34, reb: 11, ast: 9, fg: '12/25' },
          { name: 'Kyrie Irving (DAL)', pts: 24, reb: 3, ast: 5, fg: '10/20' }
        ],

        }
      },

      // Past Match (Cricket)
      {
        id: 'c2',
        sport: 'cricket',
        status: 'past',
        series: 'Border-Gavaskar Trophy - 5th Test',

        teamB: { name: 'India', short: 'IND', score: '244 & 308/7', flag: '🇮🇳' },
        liveText: 'India won by 3 wickets',
        summary: 'Player of the Match: Rishabh Pant (89* off 138 balls)',
        squads: {

          teamB: ['Rohit', 'Gill', 'Pujara', 'Rahane (c)', 'Agarwal', 'Pant (wk)', 'Sundar', 'Thakur', 'Navdeep', 'Siraj', 'Natarajan']
        }
      },

      // Past Match (Football)
      {
        id: 'f2',
        sport: 'football',
        status: 'past',
        series: 'Premier League Matchday 34',
        venue: 'Emirates Stadium, London',
        teamA: { name: 'Arsenal', short: 'ARS', score: '3', flag: '🔴' },
        teamB: { name: 'Chelsea', short: 'CHE', score: '1', flag: '🔵' },
        liveText: 'Full Time • Odegaard 18\', 31\', Jesus 34\' | Madueke 65\'',
        summary: 'Arsenal dominate North London derby counterpart to stay in title race',
        squads: {
          teamA: ['Ramsdale', 'White', 'Kiwior', 'Gabriel', 'Zinchenko', 'Jorginho', 'Xhaka', 'Odegaard', 'Saka', 'Trossard', 'Jesus'],
          teamB: ['Kepa', 'Azpilicueta', 'Fofana', 'Silva', 'Chilwell', 'Kante', 'Fernandez', 'Kovacic', 'Madueke', 'Aubameyang', 'Sterling']
        }
      },

      // Future Fixture (Tennis)
      {
        id: 't1',
        sport: 'tennis',
        status: 'future',
        series: 'Wimbledon Men\'s Singles Final',
        venue: 'Centre Court, All England Club, London',
        teamA: { name: 'Carlos Alcaraz', short: 'ALC', score: '-', flag: '🇪🇸' },
        teamB: { name: 'Jannik Sinner', short: 'SIN', score: '-', flag: '🇮🇹' },
        liveText: 'Starts Tomorrow at 14:00 BST • Surface: Grass',
        summary: 'Head-to-Head: Tied 4-4 across Grand Slam and Masters events',
        squads: {
          teamA: ['Carlos Alcaraz (World No. 2, Seed 2)'],
          teamB: ['Jannik Sinner (World No. 1, Seed 1)']
        }
      },

      // Future Fixture (Cricket)
      {
        id: 'c3',
        sport: 'cricket',
        status: 'future',
        series: 'ICC Champions Trophy 2026',
        venue: 'Eden Gardens, Kolkata',
        teamA: { name: 'India', short: 'IND', score: '-', flag: '🇮🇳' },
        teamB: { name: 'England', short: 'ENG', score: '-', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
        liveText: 'Starts Friday, Nov 13 • 14:00 IST',
        summary: 'Pitch Report: Expected high-scoring deck with initial swing under lights',
        squads: {
          teamA: ['Rohit Sharma (c)', 'Shubman Gill', 'Virat Kohli', 'Shreyas Iyer', 'KL Rahul (wk)', 'Hardik Pandya', 'Ravindra Jadeja', 'Kuldeep Yadav', 'Jasprit Bumrah', 'Mohammed Siraj', 'Arshdeep Singh'],
          teamB: ['Jos Buttler (c/wk)', 'Phil Salt', 'Will Jacks', 'Harry Brook', 'Liam Livingstone', 'Sam Curran', 'Adil Rashid', 'Jofra Archer', 'Mark Wood', 'Reece Topley', 'Gus Atkinson']
        }
      }
    ];

    // --- State ---
    let currentSport = 'all';
    let currentStatus = 'live';
    let searchQuery = '';
    let selectedMatch = null;
    let activeModalTab = 'scorecard';

    // --- DOM Elements ---
    const sportTabsContainer = document.getElementById('sport-tabs');
    const statusTabsContainer = document.getElementById('status-tabs');
    const matchesGrid = document.getElementById('matches-grid');
    const emptyState = document.getElementById('empty-state');
    const searchInput = document.getElementById('search-input');
    const modal = document.getElementById('modal-container');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    // --- Render Filter Tabs ---
    function renderFilters() {
      // Sports Tabs
      sportTabsContainer.innerHTML = sports.map(s => {
        const active = currentSport === s.id;
        return `
          <button 
            onclick="selectSport('${s.id}')"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition whitespace-nowrap ${
              active 
                ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/20' 
                : 'text-slate-300 hover:bg-slate-800'
            }"
          >
            <i data-lucide="${s.icon}" class="w-3.5 h-3.5"></i>
            ${s.name}
          </button>
        `;
      }).join('');

      // Status Tabs
      statusTabsContainer.innerHTML = matchStatuses.map(st => {
        const active = currentStatus === st.id;
        return `
          <button 
            onclick="selectStatus('${st.id}')"
            class="pb-2 border-b-2 text-xs font-bold transition flex items-center gap-2 ${
              active 
                ? 'border-emerald-400 text-emerald-400' 
                : 'border-transparent text-slate-400 hover:text-slate-200'
            }"
          >
            ${st.id === 'live' ? '<span class="w-2 h-2 rounded-full bg-red-500 pulse-indicator"></span>' : ''}
            ${st.name}
          </button>
        `;
      }).join('');

      lucide.createIcons();
    }

    // --- Filter Handlers ---
    window.selectSport = (id) => {
      currentSport = id;
      renderFilters();
      renderMatches();
    };

    window.selectStatus = (id) => {
      currentStatus = id;
      renderFilters();
      renderMatches();
    };

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderMatches();
    });

    // --- Render Match Cards ---
    function renderMatches() {
      const filtered = matches.filter(m => {
        const matchSport = currentSport === 'all' || m.sport === currentSport;
        const matchStatus = m.status === currentStatus;
        const matchQuery = 
          m.teamA.name.toLowerCase().includes(searchQuery) ||
          m.teamB.name.toLowerCase().includes(searchQuery) ||
          m.series.toLowerCase().includes(searchQuery) ||
          m.venue.toLowerCase().includes(searchQuery);

        return matchSport && matchStatus && matchQuery;
      });

      if (filtered.length === 0) {
        matchesGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      matchesGrid.innerHTML = filtered.map(m => {
        const isLive = m.status === 'live';
        return `
          <div 
            onclick="openMatchModal('${m.id}')" 
            class="group cursor-pointer rounded-2xl bg-slate-900 border border-slate-800 p-5 hover:border-emerald-500/50 hover:shadow-xl hover:shadow-emerald-500/5 transition duration-200 flex flex-col justify-between"
          >
            <div>
              <!-- Header -->
              <div class="flex items-center justify-between text-xs text-slate-400 mb-3">
                <span class="font-medium truncate max-w-[200px] text-slate-300">${m.series}</span>
                <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase ${
                  isLive 
                    ? 'bg-red-500/20 text-red-400 border border-red-500/30 pulse-indicator' 
                    : m.status === 'past' 
                    ? 'bg-slate-800 text-slate-300' 
                    : 'bg-blue-500/20 text-blue-400'
                }">
                  ${m.status.toUpperCase()}
                </span>
              </div>

              <!-- Teams & Scores -->
              <div class="space-y-3 my-4">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    <span class="text-xl">${m.teamA.flag || '🏳️'}</span>
                    <span class="font-bold text-slate-100 text-base group-hover:text-emerald-400 transition">${m.teamA.name}</span>
                  </div>
                  <span class="font-mono font-bold text-base text-white">${m.teamA.score}</span>
                </div>

                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    <span class="text-xl">${m.teamB.flag || '🏳️'}</span>
                    <span class="font-bold text-slate-100 text-base group-hover:text-emerald-400 transition">${m.teamB.name}</span>
                  </div>
                  <span class="font-mono font-bold text-base text-white">${m.teamB.score}</span>
                </div>
              </div>
            </div>

            <!-- Footer summary -->
            <div class="pt-3 border-t border-slate-800/80 text-xs">
              <p class="text-emerald-400 font-medium truncate">${m.liveText}</p>
              <p class="text-slate-500 text-[11px] mt-0.5 flex items-center gap-1 truncate">
                <i data-lucide="map-pin" class="w-3 h-3"></i> ${m.venue}
              </p>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // --- Modal Management ---
    window.openMatchModal = (id) => {
      selectedMatch = matches.find(m => m.id === id);
      if (!selectedMatch) return;

      document.getElementById('modal-sport-badge').innerText = selectedMatch.sport;
      document.getElementById('modal-series-title').innerText = selectedMatch.series;
      document.getElementById('modal-match-title').innerText = `${selectedMatch.teamA.name} vs ${selectedMatch.teamB.name}`;

      setModalTab('scorecard');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    modalCloseBtn.addEventListener('click', () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    });

    function setModalTab(tab) {
      activeModalTab = tab;
      const tabs = ['scorecard', 'timeline', 'squads'];
      tabs.forEach(t => {
        const el = document.getElementById(`modal-tab-${t}`);
        if (t === tab) {
          el.className = 'py-3 text-emerald-400 border-b-2 border-emerald-400 font-semibold';
        } else {
          el.className = 'py-3 text-slate-400 hover:text-slate-200';
        }
      });
      renderModalBody();
    }

    document.getElementById('modal-tab-scorecard').addEventListener('click', () => setModalTab('scorecard'));
    document.getElementById('modal-tab-timeline').addEventListener('click', () => setModalTab('timeline'));
    document.getElementById('modal-tab-squads').addEventListener('click', () => setModalTab('squads'));

    function renderModalBody() {
      const container = document.getElementById('modal-content-area');
      const m = selectedMatch;
      if (!m) return;

      if (activeModalTab === 'scorecard') {
        if (m.sport === 'cricket' && m.scorecard) {
          container.innerHTML = `
            <div>
              <h4 class="font-bold text-slate-200 mb-3 flex items-center gap-2">
                <i data-lucide="target" class="w-4 h-4 text-emerald-400"></i> ${m.teamA.name} Batting Innings
              </h4>
              <div class="overflow-x-auto rounded-xl border border-slate-800">
                <table class="w-full text-left text-xs font-mono">
                  <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
                    <tr>
                      <th class="p-2.5 font-sans">Batter</th>
                      <th class="p-2.5 font-sans">Dismissal</th>
                      <th class="p-2.5 text-right">R</th>
                      <th class="p-2.5 text-right">B</th>
                      <th class="p-2.5 text-right">4s</th>
                      <th class="p-2.5 text-right">6s</th>
                      <th class="p-2.5 text-right">SR</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${m.scorecard.batting.map(b => `
                      <tr class="hover:bg-slate-800/30">
                        <td class="p-2.5 font-bold font-sans text-emerald-300">${b.name}</td>
                        <td class="p-2.5 text-slate-400 font-sans text-[11px]">${b.dismiss}</td>
                        <td class="p-2.5 text-right font-bold">${b.runs}</td>
                        <td class="p-2.5 text-right text-slate-400">${b.balls}</td>
                        <td class="p-2.5 text-right">${b.f4}</td>
                        <td class="p-2.5 text-right">${b.f6}</td>
                        <td class="p-2.5 text-right text-slate-400">${b.sr}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div>
              <h4 class="font-bold text-slate-200 mb-3 flex items-center gap-2">
                <i data-lucide="activity" class="w-4 h-4 text-cyan-400"></i> ${m.teamB.name} Bowling Figures
              </h4>
              <div class="overflow-x-auto rounded-xl border border-slate-800">
                <table class="w-full text-left text-xs font-mono">
                  <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
                    <tr>
                      <th class="p-2.5 font-sans">Bowler</th>
                      <th class="p-2.5 text-right">O</th>
                      <th class="p-2.5 text-right">M</th>
                      <th class="p-2.5 text-right">R</th>
                      <th class="p-2.5 text-right font-bold text-white">W</th>
                      <th class="p-2.5 text-right">Econ</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${m.scorecard.bowling.map(bw => `
                      <tr class="hover:bg-slate-800/30">
                        <td class="p-2.5 font-bold font-sans text-slate-100">${bw.name}</td>
                        <td class="p-2.5 text-right">${bw.o}</td>
                        <td class="p-2.5 text-right text-slate-400">${bw.m}</td>
                        <td class="p-2.5 text-right">${bw.r}</td>
                        <td class="p-2.5 text-right font-bold text-emerald-400">${bw.w}</td>
                        <td class="p-2.5 text-right text-slate-400">${bw.econ}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        } else if (m.sport === 'football' && m.stats) {
          container.innerHTML = `
            <div class="space-y-4">
              <h4 class="font-bold text-slate-200">Match Statistics & Indicators</h4>
              ${Object.keys(m.stats).map(key => {
                const valA = m.stats[key][0];
                const valB = m.stats[key][1];
                return `
                  <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                      <span>${valA}</span>
                      <span class="text-slate-400 capitalize">${key}</span>
                      <span>${valB}</span>
                    </div>
                    <div class="h-2 bg-slate-800 rounded-full flex overflow-hidden">
                      <div class="bg-emerald-500 h-full" style="width: 50%"></div>
                      <div class="bg-cyan-500 h-full" style="width: 50%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else if (m.sport === 'basketball' && m.boxScore) {
          container.innerHTML = `
            <div class="space-y-5">
              <h4 class="font-bold text-slate-200">Quarter By Quarter Scoring</h4>
              <div class="overflow-x-auto rounded-xl border border-slate-800">
                <table class="w-full text-center text-xs font-mono">
                  <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
                    <tr>
                      <th class="p-2.5 text-left font-sans">Team</th>
                      <th class="p-2.5">Q1</th>
                      <th class="p-2.5">Q2</th>
                      <th class="p-2.5">Q3</th>
                      <th class="p-2.5">Q4</th>
                      <th class="p-2.5 font-bold text-white">Total</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${m.boxScore.map(b => `
                      <tr>
                        <td class="p-2.5 text-left font-bold font-sans">${b.team}</td>
                        <td class="p-2.5">${b.q1}</td>
                        <td class="p-2.5">${b.q2}</td>
                        <td class="p-2.5">${b.q3}</td>
                        <td class="p-2.5">${b.q4}</td>
                        <td class="p-2.5 font-bold text-emerald-400">${b.total}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="p-8 text-center text-slate-500">
              <p>Full match score breakdown will be unlocked as soon as play begins.</p>
              <p class="text-xs text-slate-600 mt-2">${m.summary}</p>
            </div>
          `;
        }
      } else if (activeModalTab === 'timeline') {
        const events = m.commentary || m.events || [];
        if (events.length > 0) {
          container.innerHTML = `
            <div class="space-y-3">
              ${events.map(ev => `
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs flex gap-3 items-start">
                  <span class="w-2 h-2 rounded-full bg-emerald-500 mt-1.5 flex-shrink-0"></span>
                  <p class="text-slate-200">${ev}</p>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          container.innerHTML = `<p class="text-center text-slate-500 py-8">No live commentary feeds registered yet for this match.</p>`;
        }
      } else if (activeModalTab === 'squads') {
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
              <h4 class="font-bold text-emerald-400 mb-3 flex items-center gap-2">
                <span>${m.teamA.flag || ''}</span> ${m.teamA.name} Squad
              </h4>
              <ul class="space-y-2 text-xs text-slate-300">
                ${(m.squads.teamA || []).map(p => `<li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>${p}</li>`).join('')}
              </ul>
            </div>
            <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
              <h4 class="font-bold text-cyan-400 mb-3 flex items-center gap-2">
                <span>${m.teamB.flag || ''}</span> ${m.teamB.name} Squad
              </h4>
              <ul class="space-y-2 text-xs text-slate-300">
                ${(m.squads.teamB || []).map(p => `<li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>${p}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }

      lucide.createIcons();
    }

    // --- Periodic Simulation Ticker (Simulates Active Sports API) ---
    setInterval(() => {
      // Simulate live cricket run ticker
      const cricketMatch = matches.find(m => m.id === 'c1');
      if (cricketMatch && Math.random() > 0.4) {
        const runs = [1, 2, 4, 6, 0][Math.floor(Math.random() * 5)];
        const currentRuns = parseInt(cricketMatch.teamA.score.split('/')[0]) + runs;
        cricketMatch.teamA.score = `${currentRuns}/4`;
        if (currentStatus === 'live' && (currentSport === 'all' || currentSport === 'cricket')) {
          renderMatches();
          if (selectedMatch && selectedMatch.id === 'c1' && activeModalTab === 'scorecard') {
            renderModalBody();
          }
        }
      }
    }, 4000);

    // Initial Execution
    renderFilters();
    renderMatches();
  </script>
</body>
</html>
