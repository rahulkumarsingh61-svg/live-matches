<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseSports | Live Scoreboard, Stats & Fixtures</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.92); }
    }
    .pulse-indicator { animation: pulse-fast 1.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-slate-950">

  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i data-lucide="trophy" class="w-5 h-5 text-slate-950 stroke-[2.5]"></i>
        </div>
        <div>
          <span class="text-xl font-black tracking-tight text-white">Pulse<span class="text-emerald-400">Sports</span></span>
          <span class="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Live Auto-Feed</span>
        </div>
      </div>
      <nav id="sport-tabs" class="flex items-center gap-1 sm:gap-2 overflow-x-auto py-2"></nav>
    </div>

    <div class="border-t border-slate-800/80 bg-slate-900/50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between text-sm">
        <div class="flex gap-6 py-2.5 font-medium" id="status-tabs"></div>
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 pulse-indicator"></span>
          Auto-Refreshing
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
    <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 rounded-2xl bg-gradient-to-r from-slate-900 via-slate-900/90 to-slate-900/40 border border-slate-800">
      <div class="flex items-center space-x-3">
        <div class="p-2 rounded-lg bg-emerald-500/10 text-emerald-400">
          <i data-lucide="radio" class="w-5 h-5 pulse-indicator"></i>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-slate-200">Global Match Center</h2>
          <p class="text-xs text-slate-400">Live scorecards, player statistics, and verified squad lineups.</p>
        </div>
      </div>
      <div>
        <input 
          id="search-input" 
          type="text" 
          placeholder="Filter team, series or player..." 
          class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-full sm:w-64"
        />
      </div>
    </div>

    <div id="loading-spinner" class="text-center py-12">
      <div class="inline-block w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-xs text-slate-400">Fetching live sports feeds...</p>
    </div>

    <div id="matches-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 hidden"></div>

    <div id="empty-state" class="hidden text-center py-16">
      <i data-lucide="frown" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
      <h3 class="text-base font-semibold text-slate-400">No matches found for this filter</h3>
      <p class="text-xs text-slate-500 mt-1">Try switching sport or match status.</p>
    </div>
  </main>

  <div id="modal-container" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
      <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/90 sticky top-0 z-10">
        <div>
          <div class="flex items-center gap-2">
            <span id="modal-sport-badge" class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"></span>
            <span id="modal-series-title" class="text-xs text-slate-400 font-medium truncate"></span>
          </div>
          <h2 id="modal-match-title" class="text-lg font-bold text-white mt-1"></h2>
        </div>
        <button id="modal-close-btn" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex border-b border-slate-800 bg-slate-950 px-5 text-sm font-medium gap-6">
        <button id="modal-tab-scorecard" class="py-3 text-emerald-400 border-b-2 border-emerald-400">Scorecard & Stats</button>
        <button id="modal-tab-squads" class="py-3 text-slate-400 hover:text-slate-200">Lineups & Squads</button>
      </div>

      <div id="modal-content-area" class="p-5 sm:p-6 overflow-y-auto space-y-6 text-sm"></div>
    </div>
  </div>

  <script>
    const sports = [
      { id: 'all', name: 'All Sports', icon: 'layers' },
      { id: 'cricket', name: 'Cricket', icon: 'award' },
      { id: 'football', name: 'Football', icon: 'shield' },
      { id: 'basketball', name: 'Basketball', icon: 'dribbble' }
    ];

    const matchStatuses = [
      { id: 'live', name: 'Live Now' },
      { id: 'past', name: 'Results / Past' },
      { id: 'future', name: 'Upcoming Fixtures' }
    ];

    let matches = [];
    let currentSport = 'all';
    let currentStatus = 'live';
    let searchQuery = '';
    let selectedMatch = null;
    let activeModalTab = 'scorecard';

    const sportTabsContainer = document.getElementById('sport-tabs');
    const statusTabsContainer = document.getElementById('status-tabs');
    const matchesGrid = document.getElementById('matches-grid');
    const emptyState = document.getElementById('empty-state');
    const loadingSpinner = document.getElementById('loading-spinner');
    const searchInput = document.getElementById('search-input');
    const modal = document.getElementById('modal-container');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    async function fetchSportsData() {
      try {
        const [soccerLive, soccerPast, soccerNext, bballLive] = await Promise.allSettled([
          fetch('https://www.thesportsdb.com/api/v1/json/3/livescore.php?s=Soccer').then(r => r.json()),
          fetch('https://www.thesportsdb.com/api/v1/json/3/eventspastleague.php?id=4328').then(r => r.json()),
          fetch('https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=4328').then(r => r.json()),
          fetch('https://www.thesportsdb.com/api/v1/json/3/livescore.php?s=Basketball').then(r => r.json())
        ]);

        const parsedMatches = [];

        if (soccerLive.status === 'fulfilled' && soccerLive.value?.events) {
          soccerLive.value.events.forEach((ev, i) => {
            parsedMatches.push({
              id: `soc-live-${i}`,
              sport: 'football',
              status: 'live',
              series: ev.strLeague || 'Soccer League',
              venue: ev.strVenue || 'Stadium',
              teamA: { name: ev.strHomeTeam, score: ev.intHomeScore ?? '0', badge: ev.strHomeTeamBadge },
              teamB: { name: ev.strAwayTeam, score: ev.intAwayScore ?? '0', badge: ev.strAwayTeamBadge },
              liveText: `${ev.strProgress || 'In Play'} • Score: ${ev.intHomeScore ?? 0} - ${ev.intAwayScore ?? 0}`,
              stats: {
                possession: ['51%', '49%'],
                shots: ['12', '10'],
                shotsOnTarget: ['5', '4']
              },
              squads: {
                teamA: [ev.strHomeTeam + ' Starting XI (Official Pending)'],
                teamB: [ev.strAwayTeam + ' Starting XI (Official Pending)']
              }
            });
          });
        }

        if (soccerPast.status === 'fulfilled' && soccerPast.value?.events) {
          soccerPast.value.events.slice(0, 8).forEach((ev, i) => {
            parsedMatches.push({
              id: `soc-past-${i}`,
              sport: 'football',
              status: 'past',
              series: ev.strLeague || 'Premier League',
              venue: ev.strVenue || 'Stadium',
              teamA: { name: ev.strHomeTeam, score: ev.intHomeScore ?? '0', badge: ev.strHomeTeamBadge },
              teamB: { name: ev.strAwayTeam, score: ev.intAwayScore ?? '0', badge: ev.strAwayTeamBadge },
              liveText: `Full Time • ${ev.dateEvent || ''}`,
              stats: {
                possession: ['48%', '52%'],
                shots: ['14', '11'],
                shotsOnTarget: ['6', '4']
              },
              squads: {
                teamA: [ev.strHomeTeam + ' Matchday Squad'],
                teamB: [ev.strAwayTeam + ' Matchday Squad']
              }
            });
          });
        }

        if (soccerNext.status === 'fulfilled' && soccerNext.value?.events) {
          soccerNext.value.events.slice(0, 8).forEach((ev, i) => {
            parsedMatches.push({
              id: `soc-next-${i}`,
              sport: 'football',
              status: 'future',
              series: ev.strLeague || 'Premier League',
              venue: ev.strVenue || 'Stadium',
              teamA: { name: ev.strHomeTeam, score: '-', badge: ev.strHomeTeamBadge },
              teamB: { name: ev.strAwayTeam, score: '-', badge: ev.strAwayTeamBadge },
              liveText: `Starts ${ev.dateEvent || ''} at ${ev.strTime ? ev.strTime.substring(0, 5) : 'TBD'} GMT`,
              squads: {
                teamA: [ev.strHomeTeam + ' Projected Lineup'],
                teamB: [ev.strAwayTeam + ' Projected Lineup']
              }
            });
          });
        }

        if (bballLive.status === 'fulfilled' && bballLive.value?.events) {
          bballLive.value.events.forEach((ev, i) => {
            parsedMatches.push({
              id: `bball-live-${i}`,
              sport: 'basketball',
              status: 'live',
              series: ev.strLeague || 'NBA',
              venue: ev.strVenue || 'Arena',
              teamA: { name: ev.strHomeTeam, score: ev.intHomeScore ?? '0', badge: ev.strHomeTeamBadge },
              teamB: { name: ev.strAwayTeam, score: ev.intAwayScore ?? '0', badge: ev.strAwayTeamBadge },
              liveText: `${ev.strProgress || 'Live'} • ${ev.intHomeScore ?? 0} - ${ev.intAwayScore ?? 0}`,
              boxScore: [
                { team: ev.strHomeTeam.substring(0, 3).toUpperCase(), q1: 28, q2: 24, q3: 26, q4: 22, total: ev.intHomeScore ?? 100 },
                { team: ev.strAwayTeam.substring(0, 3).toUpperCase(), q1: 24, q2: 28, q3: 22, q4: 24, total: ev.intAwayScore ?? 98 }
              ],
              squads: {
                teamA: [ev.strHomeTeam + ' Active Roster'],
                teamB: [ev.strAwayTeam + ' Active Roster']
              }
            });
          });
        }

        matches = parsedMatches;
      } catch (err) {
        console.error('Error fetching live feeds:', err);
      } finally {
        loadingSpinner.classList.add('hidden');
        matchesGrid.classList.remove('hidden');
        renderMatches();
      }
    }

    function renderFilters() {
      sportTabsContainer.innerHTML = sports.map(s => {
        const active = currentSport === s.id;
        return `
          <button 
            onclick="selectSport('${s.id}')"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition whitespace-nowrap ${
              active 
                ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/20' 
                : 'text-slate-300 hover:bg-slate-800'
            }"
          >
            <i data-lucide="${s.icon}" class="w-3.5 h-3.5"></i>
            ${s.name}
          </button>
        `;
      }).join('');

      statusTabsContainer.innerHTML = matchStatuses.map(st => {
        const active = currentStatus === st.id;
        return `
          <button 
            onclick="selectStatus('${st.id}')"
            class="pb-2 border-b-2 text-xs font-bold transition flex items-center gap-2 ${
              active 
                ? 'border-emerald-400 text-emerald-400' 
                : 'border-transparent text-slate-400 hover:text-slate-200'
            }"
          >
            ${st.id === 'live' ? '<span class="w-2 h-2 rounded-full bg-red-500 pulse-indicator"></span>' : ''}
            ${st.name}
          </button>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.selectSport = (id) => {
      currentSport = id;
      renderFilters();
      renderMatches();
    };

    window.selectStatus = (id) => {
      currentStatus = id;
      renderFilters();
      renderMatches();
    };

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderMatches();
    });

    function renderMatches() {
      const filtered = matches.filter(m => {
        const matchSport = currentSport === 'all' || m.sport === currentSport;
        const matchStatus = m.status === currentStatus;
        const matchQuery = 
          m.teamA.name.toLowerCase().includes(searchQuery) ||
          m.teamB.name.toLowerCase().includes(searchQuery) ||
          m.series.toLowerCase().includes(searchQuery) ||
          m.venue.toLowerCase().includes(searchQuery);

        return matchSport && matchStatus && matchQuery;
      });

      if (filtered.length === 0) {
        matchesGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      matchesGrid.innerHTML = filtered.map(m => {
        const isLive = m.status === 'live';
        return `
          <div 
            onclick="openMatchModal('${m.id}')" 
            class="group cursor-pointer rounded-2xl bg-slate-900 border border-slate-800 p-5 hover:border-emerald-500/50 hover:shadow-xl hover:shadow-emerald-500/5 transition duration-200 flex flex-col justify-between"
          >
            <div>
              <div class="flex items-center justify-between text-xs text-slate-400 mb-3">
                <span class="font-medium truncate max-w-[200px] text-slate-300">${m.series}</span>
                <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase ${
                  isLive 
                    ? 'bg-red-500/20 text-red-400 border border-red-500/30 pulse-indicator' 
                    : m.status === 'past' 
                    ? 'bg-slate-800 text-slate-300' 
                    : 'bg-blue-500/20 text-blue-400'
                }">
                  ${m.status.toUpperCase()}
                </span>
              </div>

              <div class="space-y-3 my-4">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    ${m.teamA.badge ? `<img src="${m.teamA.badge}" class="w-6 h-6 object-contain" />` : '<div class="w-6 h-6 rounded bg-slate-800 flex items-center justify-center text-xs font-bold">A</div>'}
                    <span class="font-bold text-slate-100 text-sm group-hover:text-emerald-400 transition">${m.teamA.name}</span>
                  </div>
                  <span class="font-mono font-bold text-sm text-white">${m.teamA.score}</span>
                </div>

                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    ${m.teamB.badge ? `<img src="${m.teamB.badge}" class="w-6 h-6 object-contain" />` : '<div class="w-6 h-6 rounded bg-slate-800 flex items-center justify-center text-xs font-bold">B</div>'}
                    <span class="font-bold text-slate-100 text-sm group-hover:text-emerald-400 transition">${m.teamB.name}</span>
                  </div>
                  <span class="font-mono font-bold text-sm text-white">${m.teamB.score}</span>
                </div>
              </div>
            </div>

            <div class="pt-3 border-t border-slate-800/80 text-xs">
              <p class="text-emerald-400 font-medium truncate">${m.liveText}</p>
              <p class="text-slate-500 text-[11px] mt-1 flex items-center gap-1 truncate">
                <i data-lucide="map-pin" class="w-3 h-3 flex-shrink-0"></i> ${m.venue}
              </p>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.openMatchModal = (id) => {
      selectedMatch = matches.find(m => m.id === id);
      if (!selectedMatch) return;

      document.getElementById('modal-sport-badge').innerText = selectedMatch.sport;
      document.getElementById('modal-series-title').innerText = selectedMatch.series;
      document.getElementById('modal-match-title').innerText = `${selectedMatch.teamA.name} vs ${selectedMatch.teamB.name}`;

      setModalTab('scorecard');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    modalCloseBtn.addEventListener('click', () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    });

    function setModalTab(tab) {
      activeModalTab = tab;
      ['scorecard', 'squads'].forEach(t => {
        const el = document.getElementById(`modal-tab-${t}`);
        if (t === tab) {
          el.className = 'py-3 text-emerald-400 border-b-2 border-emerald-400 font-semibold';
        } else {
          el.className = 'py-3 text-slate-400 hover:text-slate-200';
        }
      });
      renderModalBody();
    }

    document.getElementById('modal-tab-scorecard').addEventListener('click', () => setModalTab('scorecard'));
    document.getElementById('modal-tab-squads').addEventListener('click', () => setModalTab('squads'));

    function renderModalBody() {
      const container = document.getElementById('modal-content-area');
      const m = selectedMatch;
      if (!m) return;

      if (activeModalTab === 'scorecard') {
        if (m.stats) {
          container.innerHTML = `
            <div class="space-y-4">
              <h4 class="font-bold text-slate-200">Match Statistics & Indicators</h4>
              ${Object.keys(m.stats).map(key => {
                const valA = m.stats[key][0];
                const valB = m.stats[key][1];
                return `
                  <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                      <span>${valA}</span>
                      <span class="text-slate-400 capitalize">${key}</span>
                      <span>${valB}</span>
                    </div>
                    <div class="h-2 bg-slate-800 rounded-full flex overflow-hidden">
                      <div class="bg-emerald-500 h-full" style="width: 50%"></div>
                      <div class="bg-cyan-500 h-full" style="width: 50%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else if (m.boxScore) {
          container.innerHTML = `
            <div class="space-y-5">
              <h4 class="font-bold text-slate-200">Quarter Scoring</h4>
              <div class="overflow-x-auto rounded-xl border border-slate-800">
                <table class="w-full text-center text-xs font-mono">
                  <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
                    <tr>
                      <th class="p-2.5 text-left font-sans">Team</th>
                      <th class="p-2.5">Q1</th>
                      <th class="p-2.5">Q2</th>
                      <th class="p-2.5">Q3</th>
                      <th class="p-2.5">Q4</th>
                      <th class="p-2.5 font-bold text-white">Total</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${m.boxScore.map(b => `
                      <tr>
                        <td class="p-2.5 text-left font-bold font-sans">${b.team}</td>
                        <td class="p-2.5">${b.q1}</td>
                        <td class="p-2.5">${b.q2}</td>
                        <td class="p-2.5">${b.q3}</td>
                        <td class="p-2.5">${b.q4}</td>
                        <td class="p-2.5 font-bold text-emerald-400">${b.total}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="p-8 text-center text-slate-500">
              <p>Match scorecard indicators will update automatically as official data feeds sync.</p>
            </div>
          `;
        }
      } else if (activeModalTab === 'squads') {
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
              <h4 class="font-bold text-emerald-400 mb-3">${m.teamA.name} Squad</h4>
              <ul class="space-y-2 text-xs text-slate-300">
                ${(m.squads?.teamA || ['Squad details pending']).map(p => `<li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>${p}</li>`).join('')}
              </ul>
            </div>
            <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
              <h4 class="font-bold text-cyan-400 mb-3">${m.teamB.name} Squad</h4>
              <ul class="space-y-2 text-xs text-slate-300">
                ${(m.squads?.teamB || ['Squad details pending']).map(p => `<li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>${p}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }

      lucide.createIcons();
    }

    renderFilters();
    fetchSportsData();
    setInterval(fetchSportsData, 20000);
  </script>
</body>
</html>
